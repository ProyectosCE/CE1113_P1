name: Validación del repositorio

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  repository-and-yocto:
    name: Estructura y metadata Yocto
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v6
      - name: Validar estructura, nombres, capas y recetas
        shell: bash
        run: |
          set -euo pipefail
          bash -n ./scripts/validate-repository.sh
          ./scripts/check-repository.sh
      - name: Validar interfaces no interactivas
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh --help
          ./check_image.sh --help
          ./flash_sd.sh --help
          ./load_audio.sh --help
          ./scripts/create-recipe.sh --help
      - name: Probar creación de receta sin alterar el checkout
        shell: bash
        run: |
          set -euo pipefail
          test_root=$(mktemp -d)
          mkdir -p "$test_root/repository/scripts"
          cp -a meta-ce1113 "$test_root/repository/"
          cp scripts/create-recipe.sh "$test_root/repository/scripts/"
          cd "$test_root/repository"
          ./scripts/create-recipe.sh --category test --name ci-receta --version 1.0.0
          test -f meta-ce1113/recipes-test/ci-receta/ci-receta_1.0.0.bb
          grep -q 'ci-receta' meta-ce1113/recipes-core/packagegroups/packagegroup-ce1113-test.bb

  native-cmake-build:
    name: Compilar bibliotecas y aplicaciones AuraBot
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v6
      - name: Compilar e instalar bibliotecas en staging
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/aurabot-root"
          for component in libgpio audio aurabot-api; do
            cmake -S "meta-ce1113/recipes-lib/$component/files" -B "build-$component" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix"
            cmake --build "build-$component" --parallel
            cmake --install "build-$component"
          done
          for component in pwm leds sensors; do
            cmake -S "meta-ce1113/recipes-lib/$component/files" -B "build-$component" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix" -DCMAKE_PREFIX_PATH="$prefix"
            cmake --build "build-$component" --parallel
            cmake --install "build-$component"
          done
          ctest --test-dir build-pwm --output-on-failure
      - name: Compilar aplicaciones contra las bibliotecas compartidas
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/aurabot-root"
          cmake -S meta-ce1113/recipes-auraapp/aurabot/files -B build-aurabot -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build-aurabot --parallel
          ctest --test-dir build-aurabot --output-on-failure
          cmake -S meta-ce1113/recipes-auraapp/aurabot-audio-server/files -B build-audio-server -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build-audio-server --parallel
          cmake -S meta-ce1113/recipes-auraapp/webapp/files -B build-webapp -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build-webapp --parallel
      - name: Probar web autenticada con hardware simulado
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/aurabot-root"
          runtime="$RUNNER_TEMP/aurabot-runtime"
          mkdir -p "$runtime"
          cmake -S meta-ce1113/recipes-lib/aurabot-api/files -B build-aurabot-api-fake \
            -DCMAKE_BUILD_TYPE=Release \
            -DAURABOT_RUNTIME_DIRECTORY_OVERRIDE="$runtime"
          cmake --build build-aurabot-api-fake --parallel
          cmake -S meta-ce1113/recipes-auraapp/aurabot/files -B build-aurabot-fake \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix" \
            -DAURABOT_FAKE_HARDWARE=ON \
            -DAURABOT_RUNTIME_DIRECTORY_OVERRIDE="$runtime"
          cmake --build build-aurabot-fake --parallel
          node --check meta-ce1113/recipes-auraapp/webapp/files/app.js
          node --check meta-ce1113/recipes-auraapp/webapp/files/auth.js
          node --check meta-ce1113/recipes-auraapp/webapp/files/robot-control.js
          LD_LIBRARY_PATH="$PWD/build-aurabot-api-fake:$prefix/lib" \
            node scripts/test-web-integration.mjs \
            --daemon build-aurabot-fake/aurabot \
            --cgi build-webapp/operaciones.cgi
