name: Validación del repositorio

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  repository-and-yocto:
    name: Estructura y metadata Yocto
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v6
      - name: Verificar append de rpi-cmdline sin versión
        shell: bash
        run: |
          set -euo pipefail
          append_dir="layers/meta-aura-apps/recipes-bsp/bootfiles"
          test -f "$append_dir/rpi-cmdline.bbappend"
          test ! -e "$append_dir/rpi-cmdline_%.bbappend"
      - name: Validar estructura, nombres, capas y recetas
        shell: bash
        run: |
          set -euo pipefail
          bash -n ./scripts/validate-repository.sh
          ./scripts/validate-repository.sh

  native-cmake-build:
    name: Compilar fuentes de la receta AuraBot
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v6
      - name: Configurar
        run: cmake -S layers/meta-aura-apps/recipes-apps/aurabot/files -B build-native -DCMAKE_BUILD_TYPE=Release
      - name: Compilar
        run: cmake --build build-native --parallel
      - name: Instalar en staging
        run: cmake --install build-native --prefix "$RUNNER_TEMP/aurabot-root"
