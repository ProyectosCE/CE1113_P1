BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "auraapps"
BBFILE_PATTERN_auraapps = "^${LAYERDIR}/"
BBFILE_PRIORITY_auraapps = "7"

LAYERVERSION_auraapps = "1"
LAYERDEPENDS_auraapps = "core ce1113"
LAYERSERIES_COMPAT_auraapps = "scarthgap"

# Prueba temporal de salida por el jack analógico. No debe combinarse con
# meta-pwm, porque ambos utilizan el bloque PWM de la Raspberry Pi.
RPI_EXTRA_CONFIG:append:raspberrypi4 = " \n \
dtparam=audio=on \n \
"

# El driver del audio analógico se compila como módulo en linux-raspberrypi.
# Cargarlo durante el arranque crea la tarjeta ALSA Headphones.
KERNEL_MODULE_AUTOLOAD:append:raspberrypi4 = " snd-bcm2835"

PACKAGECONFIG:append:pn-mpg123 = " alsa"
