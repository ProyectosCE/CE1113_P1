BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "pwm"
BBFILE_PATTERN_pwm = "^${LAYERDIR}/"
BBFILE_PRIORITY_pwm = "7"

LAYERDEPENDS_pwm = "core raspberrypi"
LAYERSERIES_COMPAT_pwm = "scarthgap"

# Build and deploy the firmware overlay, then activate it in config.txt.
# These settings are deliberately restricted to the 32-bit RPi 4 machine used
# by AuraBot and append to, rather than replace, meta-raspberrypi defaults.
RPI_KERNEL_DEVICETREE_OVERLAYS:append:raspberrypi4 = " overlays/pwm-2chan.dtbo"
RPI_EXTRA_CONFIG:append:raspberrypi4 = " \n \
    # AuraBot motor hardware PWM: PWM0=GPIO12, PWM1=GPIO13 \n \
    dtoverlay=pwm-2chan,pin=12,func=4,pin2=13,func2=4 \n \
"
